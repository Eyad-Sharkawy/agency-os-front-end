<aos-button
  variant="primary"
  size="xs"
  shape="circle"
  type="button"
  class="border-hairline size-9 border font-mono text-xs font-bold tracking-wider shadow-xs"
  [ariaExpanded]="isOpen() ? 'true' : 'false'"
  [ariaLabel]="authStore.initials() + ' - User profile menu'"
  (click)="toggleMenu($event)"
>
  {{ authStore.initials() }}
</aos-button>

@if (isOpen()) {
  <div
    role="menu"
    class="bg-canvas border-hairline absolute top-full right-0 z-50 mt-2 w-64 rounded-sm border p-1 shadow-2xl transition-all"
  >
    <!-- User Info Header -->
    <div class="border-hairline border-b px-3.5 py-3">
      <div class="flex items-center gap-2.5">
        <div
          class="bg-primary text-on-primary flex size-8 shrink-0 items-center justify-center rounded-sm font-mono text-xs font-bold"
        >
          {{ authStore.initials() }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-ink truncate font-sans text-xs font-semibold">
            {{ authStore.firstName() }} {{ authStore.lastName() }}
          </p>
          @if (authStore.username()) {
            <p class="text-brand-green truncate font-mono text-[11px]">
              &#64;{{ authStore.username() }}
            </p>
          }
        </div>
      </div>
      @if (authStore.userEmail()) {
        <p class="text-muted mt-1.5 truncate font-mono text-[11px]">
          {{ authStore.userEmail() }}
        </p>
      }
    </div>

    <!-- Actions List -->
    <div class="flex flex-col space-y-0.5 pt-1">
      <!-- Account Settings -->
      <aos-button
        variant="ghost"
        size="xs"
        shape="square"
        type="button"
        (click)="onManageAccount()"
        class="w-full !justify-between font-mono text-xs"
        ariaLabel="Account Settings"
      >
        <div class="flex items-center gap-2">
          <aos-icons name="lucideSettings" class="text-muted size-3.5" />
          <span>Account Settings</span>
        </div>
        <aos-icons name="lucideChevronRight" class="text-muted size-3" />
      </aos-button>

      <!-- Workspaces Switcher Link -->
      <aos-button
        variant="ghost"
        size="xs"
        shape="square"
        routerLink="/workspaces"
        (click)="close()"
        class="w-full !justify-start font-mono text-xs"
        ariaLabel="Workspaces"
      >
        <aos-icons name="lucideBuilding2" class="text-muted mr-2 size-3.5" />
        <span>Workspaces</span>
      </aos-button>

      <!-- Sign Out -->
      <aos-button
        variant="ghost"
        size="xs"
        shape="square"
        type="button"
        (click)="onSignOut()"
        class="text-error hover:bg-error/10 w-full !justify-start font-mono text-xs"
        ariaLabel="Sign out"
      >
        <aos-icons name="lucideLogOut" class="mr-2 size-3.5" />
        <span>Sign out</span>
      </aos-button>
    </div>
  </div>
}
