<button
  type="button"
  class="bg-primary text-on-primary ring-offset-surface-container-lowest focus-visible:ring-primary flex size-9 cursor-pointer items-center justify-center rounded-full text-xs font-bold tracking-wider shadow-xs transition-all hover:brightness-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="menu"
  [attr.aria-label]="authStore.initials() + ' - User profile menu'"
  (click)="toggleMenu($event)"
>
  {{ authStore.initials() }}
</button>

@if (isOpen()) {
  <div
    role="menu"
    animate.enter="menu-enter"
    animate.leave="menu-leave"
    class="bg-surface-container-lowest border-outline/15 absolute top-full right-0 z-50 mt-2 w-52 rounded-lg border py-1.5 shadow-lg"
  >
    <div class="border-outline/10 border-b px-4 py-2.5">
      <p class="text-on-surface text-sm font-semibold">
        Hello, {{ authStore.firstName() }} {{ authStore.lastName() }}
      </p>
      @if (authStore.userEmail()) {
        <p class="text-on-surface-variant/75 truncate text-xs">{{ authStore.userEmail() }}</p>
      }
    </div>

    <div class="space-y-0.5 p-1">
      <a
        routerLink="/workspaces"
        (click)="close()"
        class="text-on-surface hover:bg-surface-container-high flex w-full cursor-pointer items-center gap-2.5 rounded-md px-3 py-2 text-sm font-medium transition-colors"
      >
        <aos-icons
          name="lucideBuilding2"
          strokeWidth="1.75"
          class="text-on-surface-variant size-4"
        />
        <span>Workspaces</span>
      </a>

      <button
        type="button"
        role="menuitem"
        (click)="onSignOut()"
        class="text-error hover:bg-error/10 flex w-full cursor-pointer items-center gap-2.5 rounded-md px-3 py-2 text-sm font-medium transition-colors"
      >
        <aos-icons name="lucideLogOut" strokeWidth="1.75" class="size-4" />
        <span>Logout</span>
      </button>
    </div>
  </div>
}
