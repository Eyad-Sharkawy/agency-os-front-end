<button
  type="button"
  class="bg-primary text-on-primary border-hairline flex size-9 cursor-pointer items-center justify-center rounded-full border font-mono text-xs font-bold tracking-wider shadow-xs transition-all hover:opacity-90 focus:outline-none"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="menu"
  [attr.aria-label]="authStore.initials() + ' - User profile menu'"
  (click)="toggleMenu($event)"
>
  {{ authStore.initials() }}
</button>

@if (isOpen()) {
  <div
    role="menu"
    class="bg-canvas border-hairline absolute top-full right-0 z-50 mt-2 w-64 rounded-sm border p-1 shadow-2xl transition-all"
  >
    <!-- User Info Header -->
    <div class="border-hairline border-b px-3.5 py-3">
      <div class="flex items-center gap-2.5">
        <div
          class="bg-primary text-on-primary flex size-8 shrink-0 items-center justify-center rounded-sm font-mono text-xs font-bold"
        >
          {{ authStore.initials() }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-ink truncate font-sans text-xs font-semibold">
            {{ authStore.firstName() }} {{ authStore.lastName() }}
          </p>
          @if (authStore.username()) {
            <p class="text-brand-green truncate font-mono text-[11px]">
              &#64;{{ authStore.username() }}
            </p>
          }
        </div>
      </div>
      @if (authStore.userEmail()) {
        <p class="text-muted mt-1.5 truncate font-mono text-[11px]">
          {{ authStore.userEmail() }}
        </p>
      }
    </div>

    <!-- Actions List -->
    <div class="space-y-0.5 pt-1">
      <!-- Account Settings -->
      <button
        type="button"
        role="menuitem"
        (click)="onManageAccount()"
        (keydown.enter)="onManageAccount()"
        class="text-ink hover:bg-soft-stone flex w-full cursor-pointer items-center justify-between rounded-xs px-3 py-2 font-mono text-xs transition-colors"
      >
        <div class="flex items-center gap-2">
          <aos-icons name="lucideSettings" class="text-muted size-3.5" />
          <span>Account Settings</span>
        </div>
        <aos-icons name="lucideChevronRight" class="text-muted size-3" />
      </button>

      <!-- Workspaces Switcher Link -->
      <a
        routerLink="/workspaces"
        (click)="close()"
        role="menuitem"
        class="text-ink hover:bg-soft-stone flex w-full cursor-pointer items-center gap-2 rounded-xs px-3 py-2 font-mono text-xs transition-colors"
      >
        <aos-icons name="lucideBuilding2" class="text-muted size-3.5" />
        <span>Workspaces</span>
      </a>

      <!-- Sign Out -->
      <button
        type="button"
        role="menuitem"
        (click)="onSignOut()"
        (keydown.enter)="onSignOut()"
        class="text-error hover:bg-error/10 flex w-full cursor-pointer items-center gap-2 rounded-xs px-3 py-2 font-mono text-xs transition-colors"
      >
        <aos-icons name="lucideLogOut" class="size-3.5" />
        <span>Sign out</span>
      </button>
    </div>
  </div>
}
