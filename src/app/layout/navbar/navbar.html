<nav
  class="bg-surface-container-lowest relative flex h-16 items-center gap-6 px-6 shadow-sm md:px-15 lg:px-25"
>
  <a
    [routerLink]="authStore.isAuthenticated() ? '/workspaces' : '/'"
    class="flex items-center gap-1"
  >
    <aos-logo class="size-6 shrink-0" />
    <span class="text-primary font-bold">Agency OS</span>
  </a>

  @if (!authStore.isAuthenticated()) {
    <div class="text-on-surface-variant hidden items-center gap-6 text-sm font-medium md:flex">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="text-primary after:w-full"
        class="hover:text-primary after:bg-primary relative py-1 transition-colors after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:transition-all after:duration-200 hover:after:w-full"
      >
        Features
      </a>

      <a
        routerLink="/how-it-works"
        routerLinkActive="text-primary after:w-full"
        class="hover:text-primary after:bg-primary relative py-1 transition-colors after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:transition-all after:duration-200 hover:after:w-full"
      >
        How It Works
      </a>
    </div>
  }

  <div class="ml-auto hidden items-center gap-1.5 lg:flex">
    <!-- Theme Toggle -->
    <aos-theme-toggle buttonClass="size-9 rounded-md" />

    <aos-button variant="outlined" href="https://github.com/Eyad-Sharkawy/agency-os-back-end">
      <aos-icons name="simpleGithub" class="size-6" />
      <span class="ml-2">View on Github</span>
    </aos-button>

    @if (authStore.isAuthenticated()) {
      <aos-profile-menu />
    } @else {
      <aos-button variant="outlined" (click)="onSignIn()" (keydown.enter)="onSignIn()"
        >Login</aos-button
      >
      <aos-button variant="primary" (click)="onSignUp()" (keydown.enter)="onSignUp()"
        >Sign up</aos-button
      >
    }
  </div>

  <!-- Mobile Right Controls (Theme Toggle + Hamburger) -->
  <div class="ml-auto flex items-center gap-1 lg:hidden">
    <aos-theme-toggle buttonClass="size-8 rounded-md" />

    <aos-button
      variant="ghost"
      class="size-8"
      [ariaLabel]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      [ariaExpanded]="isMenuOpen() ? 'true' : 'false'"
      ariaControls="mobile-nav-menu"
      (click)="$event.stopPropagation(); toggleMenu()"
      (keydown.enter)="$event.stopPropagation(); toggleMenu()"
    >
      <div class="relative flex size-5 items-center justify-center">
        <aos-icons
          name="lucideMenu"
          strokeWidth="1.5"
          class="absolute inset-0 transition-all duration-300 ease-in-out"
          [class.opacity-0]="isMenuOpen()"
          [class.rotate-90]="isMenuOpen()"
          [class.scale-75]="isMenuOpen()"
          [class.opacity-100]="!isMenuOpen()"
          [class.rotate-0]="!isMenuOpen()"
          [class.scale-100]="!isMenuOpen()"
        />
        <aos-icons
          name="lucideX"
          strokeWidth="1.5"
          class="absolute inset-0 transition-all duration-300 ease-in-out"
          [class.opacity-0]="!isMenuOpen()"
          [class.-rotate-90]="!isMenuOpen()"
          [class.scale-75]="!isMenuOpen()"
          [class.opacity-100]="isMenuOpen()"
          [class.rotate-0]="isMenuOpen()"
          [class.scale-100]="isMenuOpen()"
        />
      </div>
    </aos-button>
  </div>

  <aos-dropdown-menu [(isOpen)]="isMenuOpen" />
</nav>
