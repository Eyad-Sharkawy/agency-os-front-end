@if (isOpen()) {
  <div
    id="mobile-nav-menu"
    role="menu"
    animate.enter="menu-enter"
    animate.leave="menu-leave"
    class="bg-surface-container-lowest border-outline/15 absolute inset-x-0 top-full z-50 flex w-full flex-col gap-2 border-b px-6 py-4 shadow-md lg:hidden"
  >
    <a
      routerLink="/"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="text-primary bg-surface-container-high/60 [&>span]:after:w-full"
      (click)="close()"
      role="menuitem"
      class="text-on-surface-variant hover:text-primary hover:bg-surface-container-high flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors md:hidden"
    >
      <span
        class="after:bg-primary relative py-0.5 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:transition-all after:duration-200 hover:after:w-full"
      >
        Features
      </span>
    </a>

    <a
      routerLink="/how-it-works"
      routerLinkActive="text-primary bg-surface-container-high/60 [&>span]:after:w-full"
      (click)="close()"
      role="menuitem"
      class="text-on-surface-variant hover:text-primary hover:bg-surface-container-high flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors md:hidden"
    >
      <span
        class="after:bg-primary relative py-0.5 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:transition-all after:duration-200 hover:after:w-full"
      >
        How It Works
      </span>
    </a>

    <hr class="border-outline/10 my-1 md:hidden" />

    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="text-on-surface-variant hover:text-primary hover:bg-surface-container-high flex cursor-pointer items-center justify-between rounded-md px-3 py-2 text-sm font-medium transition-colors"
    >
      <span class="flex items-center gap-2.5">
        <div class="relative flex size-4 items-center justify-center">
          <aos-icons
            name="lucideSun"
            strokeWidth="1.75"
            class="absolute inset-0 text-amber-500 transition-all duration-300 ease-in-out"
            [class.opacity-0]="themeService.theme() === 'light'"
            [class.rotate-90]="themeService.theme() === 'light'"
            [class.scale-75]="themeService.theme() === 'light'"
            [class.opacity-100]="themeService.theme() === 'dark'"
            [class.rotate-0]="themeService.theme() === 'dark'"
            [class.scale-100]="themeService.theme() === 'dark'"
          />
          <aos-icons
            name="lucideMoon"
            strokeWidth="1.75"
            class="text-on-surface-variant absolute inset-0 transition-all duration-300 ease-in-out"
            [class.opacity-0]="themeService.theme() === 'dark'"
            [class.-rotate-90]="themeService.theme() === 'dark'"
            [class.scale-75]="themeService.theme() === 'dark'"
            [class.opacity-100]="themeService.theme() === 'light'"
            [class.rotate-0]="themeService.theme() === 'light'"
            [class.scale-100]="themeService.theme() === 'light'"
          />
        </div>
        <span>{{ themeService.theme() === "dark" ? "Light Mode" : "Dark Mode" }}</span>
      </span>
      <span class="text-on-surface-variant/70 text-xs capitalize">{{ themeService.theme() }}</span>
    </button>

    <aos-button variant="outlined" href="https://github.com/Eyad-Sharkawy/agency-os-back-end">
      <aos-icons name="simpleGithub" class="size-6" />
      <span class="ml-2">View on Github</span>
    </aos-button>

    @if (authStore.isAuthenticated()) {
      <div
        class="bg-surface-container-high/40 text-on-surface flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium"
      >
        <div
          class="bg-primary text-on-primary flex size-8 shrink-0 items-center justify-center rounded-full text-xs font-bold tracking-wider"
        >
          {{ authStore.initials() }}
        </div>
        <div class="flex flex-col truncate">
          <span class="font-semibold">Hello, {{ authStore.firstName() }}</span>
          @if (authStore.userEmail()) {
            <span class="text-on-surface-variant/75 truncate text-xs">{{
              authStore.userEmail()
            }}</span>
          }
        </div>
      </div>

      <aos-button variant="outlined" (click)="onSignOut()">Logout</aos-button>
    } @else {
      <aos-button variant="outlined" (click)="onSignIn()">Login</aos-button>
      <aos-button variant="primary" (click)="onSignUp()">Sign up</aos-button>
    }
  </div>
}
