<div class="flex min-h-screen flex-1">
  <!-- Desktop Sticky Sidebar -->
  <div class="hidden shrink-0 lg:flex">
    <aos-sidebar />
  </div>

  <!-- Mobile Off-Canvas Sidebar Modal -->
  @if (isMobileSidebarOpen()) {
    <dialog
      open
      class="fixed inset-0 z-50 m-0 flex h-full max-h-none w-full max-w-none border-0 bg-transparent p-0 lg:hidden"
      aria-label="Mobile Navigation Sidebar"
    >
      <!-- Backdrop Button -->
      <aos-button
        variant="ghost"
        type="button"
        class="fixed inset-0 block !p-0"
        buttonClass="fixed inset-0 cursor-pointer border-0 bg-black/60 p-0 backdrop-blur-xs rounded-none w-full h-full"
        (click)="closeMobileSidebar()"
        (keydown.enter)="closeMobileSidebar()"
        (keydown.escape)="closeMobileSidebar()"
        ariaLabel="Close mobile sidebar backdrop"
        animate.enter="backdrop-enter"
        animate.leave="backdrop-leave"
      />

      <!-- Off-Canvas Drawer -->
      <div
        class="bg-canvas border-hairline relative z-10 h-full w-64 border-r shadow-2xl"
        tabindex="-1"
        animate.enter="drawer-enter"
        animate.leave="drawer-leave"
      >
        <aos-sidebar (closeMobile)="closeMobileSidebar()" />
      </div>
    </dialog>
  }

  <!-- Main Viewport Area -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Top Workspace Sub-Header Bar -->
    <header
      class="bg-canvas border-hairline sticky top-0 z-30 flex h-14 items-center justify-between border-b px-4 md:px-8"
    >
      <div class="flex items-center gap-3">
        <!-- Mobile Sidebar Toggle -->
        <aos-button
          variant="ghost"
          size="xs"
          shape="circle"
          type="button"
          (click)="toggleMobileSidebar()"
          (keydown.enter)="toggleMobileSidebar()"
          class="lg:hidden"
          ariaLabel="Open sidebar menu"
        >
          <aos-icons name="lucideMenu" class="size-5" />
        </aos-button>

        <!-- Breadcrumb / Section Heading -->
        <div class="flex items-center gap-2">
          <span class="text-muted hidden font-mono text-xs sm:inline">
            {{ activeWorkspace()?.name || "Workspace" }}
          </span>
          <span class="text-muted hidden sm:inline">/</span>
          <h2 class="text-ink font-sans text-sm font-semibold">
            {{ currentSectionTitle() }}
          </h2>
        </div>
      </div>

      <!-- Quick Action / Theme Status -->
      <div class="flex items-center gap-3">
        @if (activeWorkspace()?.role) {
          <span
            class="bg-soft-stone text-muted border-hairline hidden rounded-full border px-2.5 py-0.5 font-mono text-[10px] font-medium tracking-wider uppercase sm:inline-flex"
          >
            {{ activeWorkspace()?.role }}
          </span>
        }
      </div>
    </header>

    <!-- Main Dynamic Content Canvas -->
    <main class="mx-auto w-full max-w-7xl flex-1 p-4 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
