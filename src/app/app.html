<div class="bg-canvas text-ink flex min-h-screen flex-col">
  @if (isNavigating()) {
    <div
      class="bg-brand-green/20 fixed inset-x-0 top-0 z-50 h-0.5 overflow-hidden"
      role="progressbar"
      aria-label="Loading page"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div class="animate-indeterminate bg-brand-green h-full shadow-xs"></div>
    </div>
  }

  @if (!isAppRoute()) {
    <aos-navbar />
  }

  <main class="flex flex-1 flex-col">
    <router-outlet />
  </main>

  @if (!isAppRoute()) {
    <aos-footer />
  }

  <aos-workspace-manage-modal />
  <aos-profile-modal />
</div>
