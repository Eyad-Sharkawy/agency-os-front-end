@if (isOpen()) {
  <!-- Modal Dialog -->
  <dialog
    open
    aria-labelledby="pdf-modal-title"
    class="fixed inset-0 z-50 m-0 flex h-full max-h-none w-full max-w-none items-center justify-center border-0 bg-black/60 p-3 backdrop-blur-xs sm:p-6"
  >
    <div
      class="border-hairline bg-canvas relative flex h-[90vh] w-full max-w-4xl flex-col rounded-md border shadow-2xl transition-all"
    >
      <!-- Header -->
      <div class="border-hairline flex items-center justify-between border-b px-6 py-4">
        <div class="flex items-center gap-3">
          <div class="bg-soft-stone text-ink flex size-8 items-center justify-center rounded-sm">
            <aos-icons name="lucideFileText" class="size-4" />
          </div>
          <div>
            <h2 id="pdf-modal-title" class="text-ink font-display text-base font-semibold">
              Invoice #{{ invoice()?.id?.slice(0, 8) }}
            </h2>
            <p class="text-body-muted font-mono text-xs">Vector PDF generated by Apache PDFBox</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <aos-button
            variant="outlined"
            size="sm"
            type="button"
            (click)="onDownload()"
            (keydown.enter)="onDownload()"
            [disabled]="isDownloading()"
          >
            @if (isDownloading()) {
              <aos-icons name="lucideLoader2" class="mr-1.5 size-4 animate-spin" />
              <span>Downloading...</span>
            } @else {
              <aos-icons name="lucideDownload" class="mr-1.5 size-4" />
              <span>Download PDF</span>
            }
          </aos-button>

          <button
            type="button"
            (click)="onClose()"
            class="text-muted hover:text-ink hover:bg-soft-stone rounded-sm p-1.5 transition-colors"
            aria-label="Close"
          >
            <aos-icons name="lucideX" class="size-4" />
          </button>
        </div>
      </div>

      <!-- PDF Preview Viewport -->
      <div
        class="bg-soft-stone/30 relative flex flex-1 items-center justify-center overflow-hidden p-2"
      >
        @if (safePdfUrl(); as url) {
          <iframe
            [src]="url"
            class="border-hairline size-full rounded-sm border bg-white shadow-xs"
            title="Invoice PDF Preview"
          ></iframe>
        } @else {
          <div class="flex flex-col items-center justify-center gap-3 p-8 text-center">
            <aos-icons name="lucideLoader2" class="text-muted size-8 animate-spin" />
            <p class="text-body-muted font-mono text-xs">Streaming vector PDF document...</p>
          </div>
        }
      </div>
    </div>
  </dialog>
}
