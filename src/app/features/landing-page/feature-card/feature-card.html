<article
  class="group border-hairline bg-canvas hover:bg-soft-stone/40 relative flex h-full w-full flex-col justify-between rounded-sm border p-6 transition-colors duration-150"
>
  <div class="flex flex-col gap-4">
    <div class="text-ink flex size-8 items-center justify-start">
      <ng-content select="aos-icons" />
    </div>
    <h3 class="text-ink font-sans text-lg font-medium tracking-tight">
      <ng-content select="title" />
    </h3>
    <p class="text-body-muted text-sm leading-relaxed">
      <ng-content select="description" />
    </p>
  </div>
  <div class="border-hairline/60 mt-2 border-t pt-4">
    <span
      class="text-ink inline-flex items-center gap-1 text-xs font-medium underline-offset-4 group-hover:underline"
    >
      Explore capability &rarr;
    </span>
  </div>
</article>
