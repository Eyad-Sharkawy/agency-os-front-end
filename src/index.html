<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agency OS - All-in-One Agency Management Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Immediate Theme Initialization to Prevent Theme Flash & CLS -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("agency_os_theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Critical Baseline Styles to Prevent Icon & Logo Blowout / CLS Before CSS Loads -->
    <style>
      html.dark {
        color-scheme: dark;
        background-color: #121417;
        color: #e2e2e6;
      }
      html:not(.dark) {
        color-scheme: light;
        background-color: #f7f9fb;
        color: #1a1c1e;
      }
      aos-icons,
      aos-logo,
      ng-icon {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        vertical-align: middle !important;
      }
      aos-icons svg,
      ng-icon svg {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        display: block !important;
      }
      aos-logo img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }
    </style>

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="yqaL5zw1dV8cHy6aK0YWSMit6b-fjTC5e61FQJVxXUo" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="Agency OS - All-in-One Agency Management Platform" />
    <meta
      name="description"
      content="Agency OS is a modern, multi-tenant agency management platform for CRM, project workflows, real-time time tracking, and automated PDF invoicing."
    />
    <meta
      name="keywords"
      content="agency management, multi-tenant, crm, project management, time tracking, invoice generation, agency os"
    />
    <meta name="author" content="Eyad Sharkawy" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://agency-os-eyad.vercel.app/" />

    <!-- Theme & Accent Color (Discord Embed Line + Mobile Address Bar) -->
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Facebook / LinkedIn / Discord / Slack / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agency OS" />
    <meta property="og:url" content="https://agency-os-eyad.vercel.app/" />
    <meta property="og:title" content="Agency OS - All-in-One Agency Management Platform" />
    <meta
      property="og:description"
      content="Streamline agency operations: client CRM, project workflows, live time tracking, and automated PDF invoicing."
    />
    <meta property="og:image" content="https://agency-os-eyad.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://agency-os-eyad.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agency OS Platform Preview" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://agency-os-eyad.vercel.app/" />
    <meta name="twitter:title" content="Agency OS - All-in-One Agency Management Platform" />
    <meta
      name="twitter:description"
      content="Streamline agency operations: client CRM, project workflows, live time tracking, and automated PDF invoicing."
    />
    <meta name="twitter:image" content="https://agency-os-eyad.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Agency OS Platform Preview" />

    <!-- Apple & Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agency OS" />

    <!-- App Icons / Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/logo/logo-mark.svg" />

    <!-- Google Fonts: Plus Jakarta Sans with Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface text-on-surface font-sans">

  </body>
