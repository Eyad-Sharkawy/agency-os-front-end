# SonarQube / SonarCloud Project Configuration
sonar.projectKey=Eyad-Sharkawy_agency-os-front-end
sonar.projectName=agency-os-front-end

# Source code and test configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/*.spec.ts,**/*.test.ts,node_modules/**,dist/**,coverage/**

# Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage (LCOV generated by Vitest)
sonar.javascript.lcov.reportPaths=coverage/agency-os/lcov.info
sonar.coverage.exclusions=src/main.ts,src/environments/**,src/app/app.config.ts,src/**/*.routes.ts,src/app/core/tokens/**

